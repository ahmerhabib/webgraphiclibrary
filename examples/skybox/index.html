<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webgraphiclibrary — skybox with CubemapTexture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        background: #0b1017;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        width: 1280px;
        border-radius: 14px;
        overflow: hidden;
        background: #0d1520;
        border: 1px solid #1e2b3a;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .frame {
        position: relative;
        line-height: 0;
      }
      canvas {
        display: block;
        width: 1280px;
        height: 512px;
      }
      .tag {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        background: rgba(9, 14, 20, 0.72);
        color: #eaf2ff;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .caption {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        font-size: 14px;
        color: #9db2c9;
        border-top: 1px solid #1e2b3a;
      }
      .caption strong {
        color: #eaf2ff;
        font-weight: 650;
      }
      .pill {
        font-size: 12.5px;
        color: #7fd4c1;
        background: rgba(42, 143, 122, 0.16);
        border: 1px solid rgba(42, 143, 122, 0.4);
        padding: 4px 10px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame">
        <canvas id="scene" width="1280" height="512"></canvas>
        <span class="tag">6 procedural faces — 1 samplerCube</span>
      </div>
      <div class="caption">
        <span
          ><strong>Skybox</strong> — six generated faces uploaded through a
          <code>CubemapTexture</code>, sampled per-pixel along the view ray</span
        >
        <span class="pill">CubemapTexture · samplerCube</span>
      </div>
    </div>

    <script type="module">
      import { Shader } from "../../dist/shader.js";
      import { Program } from "../../dist/program.js";
      import { GLBuffer } from "../../dist/buffer.js";
      import { CubemapTexture } from "../../dist/texture.js";

      const canvas = document.querySelector("#scene");
      const gl = canvas.getContext("webgl", { antialias: true });

      // Directions for texel (u, v) on each cubemap face, +X … -Z.
      const FACE_DIRS = [
        (u, v) => [1, -v, -u],
        (u, v) => [-1, -v, u],
        (u, v) => [u, 1, v],
        (u, v) => [u, -1, -v],
        (u, v) => [u, -v, 1],
        (u, v) => [-u, -v, -1]
      ];

      const SIZE = 128;
      const SUN = normalize([0.4, 0.45, -0.8]);

      function normalize([x, y, z]) {
        const n = Math.hypot(x, y, z);
        return [x / n, y / n, z / n];
      }

      // A tiny CPU sky model: horizon gradient, deep zenith, sun disk + glow.
      function makeFace(face) {
        const pixels = new Uint8Array(SIZE * SIZE * 4);
        for (let y = 0; y < SIZE; y += 1) {
          for (let x = 0; x < SIZE; x += 1) {
            const u = (2 * (x + 0.5)) / SIZE - 1;
            const v = (2 * (y + 0.5)) / SIZE - 1;
            const dir = normalize(FACE_DIRS[face](u, v));

            const t = Math.max(0, dir[1]);
            let r = 0.42 + 0.1 * (1 - t) - 0.34 * t;
            let g = 0.56 + 0.12 * (1 - t) - 0.3 * t;
            let b = 0.78 + 0.1 * (1 - t) - 0.18 * t;
            if (dir[1] < 0) {
              const d = Math.min(1, -dir[1] * 2.2);
              r = 0.42 - 0.32 * d;
              g = 0.56 - 0.42 * d;
              b = 0.78 - 0.58 * d;
            }

            const cos = dir[0] * SUN[0] + dir[1] * SUN[1] + dir[2] * SUN[2];
            const glow = Math.pow(Math.max(0, cos), 48);
            const disk = cos > 0.9993 ? 1 : 0;
            r = Math.min(1, r + glow * 0.9 + disk);
            g = Math.min(1, g + glow * 0.75 + disk * 0.95);
            b = Math.min(1, b + glow * 0.45 + disk * 0.8);

            const i = (y * SIZE + x) * 4;
            pixels[i] = r * 255;
            pixels[i + 1] = g * 255;
            pixels[i + 2] = b * 255;
            pixels[i + 3] = 255;
          }
        }
        return pixels;
      }

      const cubemap = new CubemapTexture(gl, {
        size: SIZE,
        data: Array.from({ length: 6 }, (_, face) => makeFace(face))
      });
      cubemap.generateMipmap();

      const vertex = new Shader(gl, {
        type: gl.VERTEX_SHADER,
        source: `
          attribute vec2 position;
          varying vec2 vNdc;
          void main() {
            vNdc = position;
            gl_Position = vec4(position, 0.0, 1.0);
          }`
      });

      const fragment = new Shader(gl, {
        type: gl.FRAGMENT_SHADER,
        source: `
          precision highp float;
          uniform samplerCube sky;
          uniform vec2 view; // (yaw, pitch)
          varying vec2 vNdc;

          void main() {
            float aspect = 1280.0 / 512.0;
            vec3 ray = normalize(vec3(vNdc.x * aspect * 0.6, vNdc.y * 0.6, -1.0));

            float cp = cos(view.y), sp = sin(view.y);
            ray = vec3(ray.x, ray.y * cp - ray.z * sp, ray.y * sp + ray.z * cp);
            float cy = cos(view.x), sy = sin(view.x);
            ray = vec3(ray.x * cy + ray.z * sy, ray.y, -ray.x * sy + ray.z * cy);

            gl_FragColor = textureCube(sky, ray);
          }`
      });

      const program = new Program(gl, { vertexShader: vertex, fragmentShader: fragment });
      vertex.dispose();
      fragment.dispose();

      const quad = new GLBuffer(gl, {
        target: gl.ARRAY_BUFFER,
        data: new Float32Array([-1, -1, 3, -1, -1, 3])
      });

      gl.viewport(0, 0, canvas.width, canvas.height);
      program.withUsed(() => {
        program.enableAttribute("position", { buffer: quad, size: 2 });
        // setTexture targets TEXTURE_2D, so bind the cube target by hand.
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_CUBE_MAP, cubemap.texture);
        program.setUniform1i("sky", 0).setUniform2f("view", -0.45, 0.15);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      });

      window.__WEBGRAPHICLIBRARY_DEMO_READY__ = true;
    </script>
  </body>
</html>
