                - heading "OpenSSF Best Practices Badge Program" [level=2] [ref=f14e16]
                - link "Get Your Badge Now!" [ref=f14e17] [cursor=pointer]:
                    - /url: /en/projects/new
                - paragraph [ref=f14e18]:
                    - text: The
                    - link "Open Source Security Foundation (OpenSSF)" [ref=f14e19] [cursor=pointer]:
                        - /url: https://openssf.org
                    - text: Best Practices badge is a way for Free/Libre and Open Source Software (FLOSS) projects to show that they follow best practices. Projects can voluntarily self-certify, at no cost, by using this web application to explain how they follow each best practice. The OpenSSF Best Practices Badge is inspired by the many badges available to projects on GitHub. Consumers of the badge can quickly assess which FLOSS projects are following best practices and as a result are more likely to produce higher-quality secure software.
                - paragraph [ref=f14e20]:
                    - text: You can easily see the
                    - link "criteria for the passing badge" [ref=f14e21] [cursor=pointer]:
                        - /url: /en/criteria/0
                    - text: . Automated analysis will determine many of the criteria answers for you (and prevent obviously incorrect answers). More information on the OpenSSF Best Practices Badging program is
                    - link "available on GitHub" [ref=f14e22] [cursor=pointer]:
                        - /url: https://github.com/ossf/best-practices-badge
                    - text: .
                    - link "Project statistics" [ref=f14e23] [cursor=pointer]:
                        - /url: /en/project_stats
                    - text: and
                    - link "criteria statistics" [ref=f14e24] [cursor=pointer]:
                        - /url: /en/criteria_stats
                    - text: are available. The
                    - link "projects page" [ref=f14e25] [cursor=pointer]:
                        - /url: /en/projects
                    - text: shows participating projects and supports queries (e.g., you can see
                    - link "projects that have a passing badge" [ref=f14e26] [cursor=pointer]:
                        - /url: /en/projects?gteq=100
                    - text: ). You can also see
                    - link "an example (where we try to earn our own badge)" [ref=f14e27] [cursor=pointer]:
                        - /url: /en/projects/1/0
                    - text: . This project was formerly known as the Core Infrastructure Initiative (CII) Best Practices badge. and was originally developed under the CII. It is now part of the
                    - link "OpenSSF" [ref=f14e28] [cursor=pointer]:
                        - /url: https://openssf.org/
                    - link "Best Practices Working Group (WG)" [ref=f14e29] [cursor=pointer]:
                        - /url: https://github.com/ossf/wg-best-practices-os-developers
                    - text: . The OpenSSF is a foundation of the
                    - link "Linux Foundation (LF)" [ref=f14e30] [cursor=pointer]:
                        - /url: https://www.linuxfoundation.org/
                    - text: . The project was formally renamed from "CII Best Practices badge" on 2021-12-24.
                - paragraph [ref=f14e31]:
                    - emphasis [ref=f14e32]: Privacy and legal issues
                    - text: ": Please see our"
                    - link "privacy policy" [ref=f14e33] [cursor=pointer]:
                        - /url: https://www.linuxfoundation.org/privacy
                    - text: ","
                    - link "about cookies" [ref=f14e34] [cursor=pointer]:
                        - /url: /en/cookies
                    - text: ", and"
                    - link "terms of use" [ref=f14e35] [cursor=pointer]:
                        - /url: https://www.linuxfoundation.org/terms
                    - text: . The code for the badging application itself is released under the
                    - link "MIT" [ref=f14e36] [cursor=pointer]:
                        - /url: https://opensource.org/licenses/MIT
                    - text: license (projects pursuing a badge are under their respective licenses). All publicly-available non-code content managed by the badging application that was added or edited after 2024-08-23 is released under the
                    - link "Community Data License Agreement – Permissive, Version 2.0 (CDLA-Permissive-2.0)" [ref=f14e37] [cursor=pointer]:
                        - /url: https://cdla.dev/permissive-2-0/
                    - text: . Previous contributions were licensed under either the
                    - link "Creative Commons Attribution License version 3.0 (CC-BY-3.0)" [ref=f14e38] [cursor=pointer]:
                        - /url: https://creativecommons.org/licenses/by/3.0/
                    - text: ", or as CC-BY version 3.0 or later (CC-BY-3.0+). If referencing collectively or not otherwise noted, please credit the OpenSSF Best Practices badge contributors."
